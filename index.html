<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prop Firm $200 Risk & Candle Lot Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #12151c;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .card {
      background: #1e222d;
      border: 1px solid #363c4e;
      border-radius: 10px;
      padding: 24px;
      width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #00e676;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 10px;
    }
    .row {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    select, input {
      width: 100%;
      padding: 9px 10px;
      background: #131722;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .result-box {
      background: #f5f5f5;
      color: #000;
      border: 2px solid #000;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
      margin-top: 18px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .metrics {
      margin-top: 16px;
      background: #131722;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.8;
    }
    .metrics span {
      float: right;
      font-weight: bold;
      color: #38bdf8;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Prop Firm $200 Risk Lot Calculator</h2>

  <div class="row">
    <label>Instrument Preset</label>
    <select id="preset" onchange="applyPreset()">
      <option value="futures|0.25|2">MNQ (Micro Nasdaq Futures - $2/pt)</option>
      <option value="futures|0.25|20">NQ (E-mini Nasdaq Futures - $20/pt)</option>
      <option value="futures|0.25|5">MES (Micro S&P Futures - $5/pt)</option>
      <option value="futures|0.25|50">ES (E-mini S&P Futures - $50/pt)</option>
      <option value="futures|0.10|10">MGC (Micro Gold Futures - $10/pt)</option>
      <option value="futures|0.10|100">GC (Gold Futures - $100/pt)</option>
      <option value="goldcfd|0.01|1">XAUUSD (Gold CFD - 1 Lot = 100 oz)</option>
      <option value="forex|0.00001|1">EURUSD / GBPUSD (Forex - 1 Lot = 100k)</option>
      <option value="indexcfd|0.1|1">US30 / NAS100 CFD (1 Lot = 1 Unit)</option>
    </select>
  </div>

  <div class="row">
    <label>Candle Length (Points / Price Distance from Entry to Low/High)</label>
    <input type="number" id="candleLen" value="15.0" step="0.25" oninput="calc()">
  </div>

  <div class="grid-2">
    <div class="row">
      <label>Dollar Risk ($)</label>
      <input type="number" id="risk" value="200" step="10" oninput="calc()">
    </div>
    <div class="row">
      <label>Reward:Risk Ratio (1:X)</label>
      <input type="number" id="rr" value="2.0" step="0.5" oninput="calc()">
    </div>
  </div>

  <div class="grid-2">
    <div class="row">
      <label>SL Buffer (Ticks)</label>
      <input type="number" id="bufferTicks" value="2" step="1" oninput="calc()">
    </div>
    <div class="row">
      <label>Tick Size (MinTick)</label>
      <input type="number" id="tickSize" value="0.25" step="0.00001" oninput="calc()">
    </div>
  </div>

  <div class="row">
    <label>Point Value ($ per 1.0Price move per unit)</label>
    <input type="number" id="pointVal" value="2" step="0.1" oninput="calc()">
  </div>

  <!-- Visual Boxed Output Matching Screenshot -->
  <div class="result-box" id="signalBox">BUY 6 Contracts</div>

  <div class="metrics">
    <div>Total Stop Distance (w/ Buffer): <span id="outStopDist">15.50 pts</span></div>
    <div>Total Stop Ticks: <span id="outTicks">62 ticks</span></div>
    <div>1:2 Take Profit Distance: <span id="outTpDist">31.00 pts</span></div>
    <div>Actual Dollar Risk at Rounded Size: <span id="outActualRisk">$186.00</span></div>
  </div>
</div>

<script>
  let currentMode = "futures";

  function applyPreset() {
    const val = document.getElementById("preset").value.split("|");
    currentMode = val[0];
    document.getElementById("tickSize").value = parseFloat(val[1]);
    document.getElementById("pointVal").value = parseFloat(val[2]);
    calc();
  }

  function calc() {
    const candleLen   = Math.max(0, parseFloat(document.getElementById("candleLen").value) || 0);
    const risk        = Math.max(1, parseFloat(document.getElementById("risk").value) || 200);
    const rr          = Math.max(0.1, parseFloat(document.getElementById("rr").value) || 2);
    const bufferTicks = Math.max(0, parseInt(document.getElementById("bufferTicks").value) || 0);
    const tickSize    = Math.max(0.000001, parseFloat(document.getElementById("tickSize").value) || 0.25);
    const pointVal    = Math.max(0.0001, parseFloat(document.getElementById("pointVal").value) || 1);

    const stopDist    = Math.max(candleLen + (bufferTicks * tickSize), tickSize);
    const rawTvUnits  = risk / (stopDist * pointVal);

    let displayLot = 1;
    let tvQty = 1;
    let unitStr = "Contracts";

    if (currentMode === "futures") {
      tvQty = Math.max(1, Math.round(rawTvUnits));
      displayLot = tvQty;
      unitStr = "Contracts";
    } else if (currentMode === "forex") {
      displayLot = Math.max(0.01, Math.round((rawTvUnits / 100000.0) * 100) / 100);
      tvQty = displayLot * 100000.0;
      unitStr = "Lots";
    } else if (currentMode === "goldcfd") {
      displayLot = Math.max(0.01, Math.round((rawTvUnits / 100.0) * 100) / 100);
      tvQty = displayLot * 100.0;
      unitStr = "Lots";
    } else {
      displayLot = Math.max(0.01, Math.round(rawTvUnits * 100) / 100);
      tvQty = displayLot;
      unitStr = "Lots";
    }

    const actualRisk = tvQty * stopDist * pointVal;
    const tpDist     = stopDist * rr;
    const totalTicks = Math.round(stopDist / tickSize);

    document.getElementById("signalBox").innerText     = `BUY / SELL ${displayLot} (${unitStr})`;
    document.getElementById("outStopDist").innerText   = `${stopDist.toFixed(4)} pts`;
    document.getElementById("outTicks").innerText      = `${totalTicks} ticks`;
    document.getElementById("outTpDist").innerText     = `${tpDist.toFixed(4)} pts`;
    document.getElementById("outActualRisk").innerText = `$${actualRisk.toFixed(2)}`;
  }

  calc();
</script>
</body>
</html>
